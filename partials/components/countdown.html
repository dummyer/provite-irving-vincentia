<section id="counting-down" class="relative isolate z-[11] w-full overflow-hidden bg-[#715E46] text-white shadow-[0_4px_10px_rgba(0,0,0,0.6)]">
  <!-- Repeating paper texture -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 z-0 bg-repeat mix-blend-multiply"
    style="background-color:#715E46;background-image:url('assets/images/bg_motif.webp');background-position:center;background-repeat:repeat;">
  </div>

  <!-- Top frame -->
  <!-- <div class="relative z-10 h-2 w-full bg-[#715E46]"></div>
  <div aria-hidden="true" class="relative z-10 h-[38px] w-full overflow-hidden -scale-y-100">
    <div class="hidden h-full w-full bg-repeat-x md:block"
      style="background-image:url('assets/images/compressed/frame_motif.webp');background-size:auto 100px;background-position:0 -30px;"></div>
    <div class="h-full w-full bg-repeat-x md:hidden"
      style="background-image:url('assets/images/compressed/frame_motif.webp');background-size:auto 85px;background-position:-50px -20px;"></div>
  </div> -->

  <div class="relative z-10 mx-auto w-full max-w-[640px] px-9 pt-[51px] pb-[58px] md:py-[95px] text-center md:max-w-[538px] md:px-0">
    <div class="flex justify-center">
      <h1 id="countdownDate" class="countdown_title whitespace-nowrap">
        <span class="countdown-day">Saturday, </span>
        <span class="countdown-date">29 November 2026</span>
      </h1>
    </div>

    <div class="mx-auto mt-1 md:mt-[13px] w-full">
      <div class="flex h-[58px] w-full items-start justify-between md:h-[67px]">
        <div class="anim anim-bounce z-10 flex flex-col items-center justify-center text-center">
          <div class="h-[47.93px] w-[58.41px] shrink-0 md:h-[57.95px] md:w-[73.15px]"><span id="countdown-days" class="countdown_timer">59</span></div>
          <span class="countdown_timer label mt-[2px]">Days</span>
        </div>
        <div class="anim anim-bounce z-10 flex flex-col items-center justify-center text-center">
          <div class="h-[47.93px] w-[58.41px] shrink-0 md:h-[57.95px] md:w-[73.15px]"><span id="countdown-hours" class="countdown_timer">59</span></div>
          <span class="countdown_timer label mt-[2px]">Hour</span>
        </div>
        <div class="anim anim-bounce z-10 flex flex-col items-center justify-center text-center">
          <div class="h-[47.93px] w-[58.41px] shrink-0 md:h-[57.95px] md:w-[73.15px]"><span id="countdown-minutes" class="countdown_timer">59</span></div>
          <span class="countdown_timer label mt-[2px]">Minutes</span>
        </div>
        <div class="anim anim-bounce z-10 flex flex-col items-center justify-center text-center">
          <div class="h-[47.93px] w-[58.41px] shrink-0 md:h-[57.95px] md:w-[73.15px]"><span id="countdown-seconds" class="countdown_timer">59</span></div>
          <span class="countdown_timer label mt-[2px]">Seconds</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom frame -->
