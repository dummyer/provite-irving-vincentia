<div class="paper-stack paper-stack--profile lg:mt-4">
  <!-- Single mirrored pair of desktop motifs across the shared paper -->
  <img src="assets/images/motif_desktop_compressed/hero_ml.webp" alt="" aria-hidden="true"
    data-distance="50" data-duration="0.45" class="orn-enter-left pointer-events-none absolute bottom-0 left-0 z-0 hidden h-auto w-[clamp(310px,32vw,410px)] translate-y-72 lg:block" />
  <img src="assets/images/motif_desktop_compressed/hero_ml.webp" alt="" aria-hidden="true"
    data-distance="50" data-duration="0.45" data-delay="0.08" class="orn-enter-right pointer-events-none absolute bottom-0 right-0 z-0 hidden h-auto w-[clamp(310px,32vw,410px)] -scale-x-100 translate-y-72 lg:block" />
<section id="hero" class="relative z-[1] flex w-full flex-col items-center overflow-hidden bg-transparent text-center">

  <div class="relative z-10 flex w-[calc(100%_-_4.5rem)] flex-col items-center px-[15px] pt-[186px] lg:pt-[229px]">
    <img id="heroLogo" alt="" aria-hidden="true" class="hidden" />

    <div class="hero_title mb-0 w-full">
      <p class="mb-[10px] md:mb-[27px]">THE WEDDING OF</p>
      <div class="mx-auto flex h-[116px] md:h-[192px] w-full max-w-[360px] flex-col items-center">
        <p data-bind="coupleName" class="hero_title_name w-[202px] max-w-full whitespace-normal md:w-[360px]">
          Irving &amp; Nathania
        </p>
      </div>
      <p aria-hidden="true" class="hero_title_date flex h-[21px] items-center justify-center lg:mt-[31px] lg:min-h-[28px]">
        <span>05</span><span class="mx-3">.</span><span>12</span><span class="mx-3">.</span><span>26</span>
      </p>
      <span id="heroDate" class="sr-only">05 December 2026</span>
    </div>

    <img id="heroImage" src="assets/images/hero_img.webp" alt="Irving and Nathania"
      class="mt-[55px] aspect-[3/2] w-full object-cover object-[center_75%] md:max-w-[397px] md:mt-[60px]" />
  </div>
</section>
